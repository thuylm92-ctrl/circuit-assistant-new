openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Circuit Solver API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: circuit
    description: Circuit solving operations
  - name: ai
    description: AI analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /circuit/solve:
    post:
      operationId: solveCircuit
      tags: [circuit]
      summary: Solve a circuit using MNA
      description: Accepts a circuit description and solves it using Modified Nodal Analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitInput"
      responses:
        "200":
          description: Solution computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitSolution"
        "422":
          description: Circuit cannot be solved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveError"

  /circuit/validate:
    post:
      operationId: validateCircuit
      tags: [circuit]
      summary: Validate circuit topology
      description: Check if a circuit is topologically valid before solving
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitInput"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /ai/analyze:
    post:
      operationId: analyzeCircuit
      tags: [ai]
      summary: AI analysis of circuit solution
      description: Generate step-by-step natural language explanation of the MNA solution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Analysis generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"

  /ai/extract-problem:
    post:
      operationId: extractProblem
      tags: [ai]
      summary: Extract problem text from uploaded image
      description: Extract circuit problem text and requirements from an uploaded image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
      responses:
        "200":
          description: Problem extracted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResult"

  /ai/solve-unknowns:
    post:
      operationId: solveUnknowns
      tags: [ai]
      summary: Solve for multiple unknown circuit parameters subject to user constraints
      description: |
        Given a circuit where one or more components are marked as unknown ("待定"),
        plus a list of user-provided target constraints (e.g. "V(n1) = 5V",
        "I(R3) = 0.2A"), the AI symbolically writes the MNA equations and solves
        for numeric values of every unknown so that all constraints are satisfied
        simultaneously. The proposed values are then verified by re-running the
        MNA solver and re-checking the constraints; if verification fails the AI
        is asked to retry up to 3 times.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolveUnknownsRequest"
      responses:
        "200":
          description: Unknown parameters solved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveUnknownsResult"

  /ai/chat:
    post:
      operationId: chatWithAI
      tags: [ai]
      summary: Interactive Q&A about the circuit solution
      description: Ask follow-up questions about the circuit solution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CircuitNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
        - id

    CircuitElement:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - resistor
            - capacitor
            - inductor
            - voltage_source
            - current_source
            - vcvs
            - vccs
            - ccvs
            - cccs
            - wire
            - ground
            - opamp
        nodeFrom:
          type: string
        nodeTo:
          type: string
        value:
          type: number
        unit:
          type: string
        label:
          type: string
        frequency:
          type: number
          description: Frequency in Hz for AC analysis
        controlBranchId:
          type: string
          description: For controlled sources, the branch being sensed
        gain:
          type: number
          description: For controlled sources, the gain factor
      required:
        - id
        - type
        - nodeFrom
        - nodeTo

    CircuitInput:
      type: object
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/CircuitElement"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/CircuitNode"
        analysisType:
          type: string
          enum: [dc, ac]
          default: dc
        frequency:
          type: number
          description: Frequency in Hz for AC analysis
      required:
        - elements
        - nodes

    NodeVoltage:
      type: object
      properties:
        nodeId:
          type: string
        voltage:
          type: number
        voltageImag:
          type: number
          description: Imaginary part for AC analysis
        unit:
          type: string
      required:
        - nodeId
        - voltage
        - unit

    BranchCurrent:
      type: object
      properties:
        elementId:
          type: string
        current:
          type: number
        currentImag:
          type: number
          description: Imaginary part for AC analysis
        unit:
          type: string
      required:
        - elementId
        - current
        - unit

    CircuitSolution:
      type: object
      properties:
        nodeVoltages:
          type: array
          items:
            $ref: "#/components/schemas/NodeVoltage"
        branchCurrents:
          type: array
          items:
            $ref: "#/components/schemas/BranchCurrent"
        analysisType:
          type: string
        conditionNumber:
          type: number
          description: |
            Infinity-norm condition number of the MNA matrix, computed as
            ‖A‖∞ × ‖A⁻¹‖∞. The solver augments Gauss–Jordan elimination
            with the n×n identity to recover A⁻¹ for free during the same
            O(n³) factorisation, so this is an exact value (subject to
            floating-point), not a lower bound. Values above ~1e8 indicate
            the matrix is close to singular and the numerical solution may
            carry significant floating-point error; the client surfaces a
            warning chip when this threshold is crossed. Omitted when n <= 1
            (no elimination steps performed).
      required:
        - nodeVoltages
        - branchCurrents
        - analysisType

    SolveError:
      type: object
      properties:
        error:
          type: string
        reason:
          type: string
          enum:
            - singular_matrix
            - disconnected_circuit
            - no_ground
            - unsupported_element
            - other
        details:
          type: string
      required:
        - error
        - reason

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              message:
                type: string
              elementId:
                type: string
            required:
              - type
              - message
      required:
        - valid
        - issues

    AnalyzeRequest:
      type: object
      properties:
        circuit:
          $ref: "#/components/schemas/CircuitInput"
        solution:
          $ref: "#/components/schemas/CircuitSolution"
        problemText:
          type: string
          description: Optional extracted problem text from the image
        unknownElements:
          type: array
          items:
            type: string
          description: Labels of elements whose values were marked "待定" (unknown) by the user. The MNA solver still ran with substituted placeholder values, but the AI explanation should treat these as symbolic unknowns.
      required:
        - circuit
        - solution

    AnalysisStep:
      type: object
      properties:
        stepNumber:
          type: integer
        title:
          type: string
        explanation:
          type: string
        formula:
          type: string
      required:
        - stepNumber
        - title
        - explanation

    AnalysisResult:
      type: object
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisStep"
        summary:
          type: string
        keyInsights:
          type: array
          items:
            type: string
        verified:
          type: boolean
          description: |
            True if AI's independently computed answers matched the MNA solver
            within tolerance. NOTE: when placeholderBased is true the request
            uses soft-verify (numerical mismatches are logged but not enforced),
            so `verified` is always true in that mode and should be interpreted
            together with `placeholderBased`. Use `placeholderBased` to know
            whether the symbolic-explanation pathway was taken.
        verificationAttempts:
          type: integer
          description: How many AI attempts were made (1-3)
        verificationNote:
          type: string
          description: Optional message shown to the user when verification failed or partially passed
        placeholderBased:
          type: boolean
          description: |
            True when the analysis was produced for a circuit that contains
            user-marked unknown ("待定") elements. In this case the numerical
            tables (nodeVoltages / branchCurrents) on the client are computed
            from placeholder values, and the AI explanation is symbolic. The
            client should visually mark numeric tables as "based on placeholder
            values" and skip strict numerical verification of AI vs MNA.
      required:
        - steps
        - summary

    ExtractRequest:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64 encoded image data
        mimeType:
          type: string
          description: Image MIME type (image/jpeg, image/png, etc.)
      required:
        - imageBase64
        - mimeType

    ExtractResult:
      type: object
      properties:
        problemText:
          type: string
          description: Extracted problem description
        targetVariables:
          type: array
          items:
            type: string
          description: What the problem is asking to find
        constraints:
          type: array
          items:
            type: string
          description: Given constraints or conditions
        isCircuitRelated:
          type: boolean
          description: Whether the image appears to be circuit-related
        confidence:
          type: number
          description: Confidence score 0-1
      required:
        - isCircuitRelated
        - confidence

    UnknownElementSpec:
      type: object
      description: Metadata describing one element marked as "待定" by the user.
      properties:
        elementId:
          type: string
        label:
          type: string
        type:
          type: string
        unit:
          type: string
      required:
        - elementId
        - label
        - type

    UnknownValue:
      type: object
      description: One solved unknown parameter.
      properties:
        elementId:
          type: string
        label:
          type: string
        value:
          type: number
        valueImag:
          type: number
          description: Imaginary part for AC analysis (phasor)
        unit:
          type: string
        displayValue:
          type: string
          description: Human-friendly formatted value (e.g. "10 Ω", "5∠30° V")
      required:
        - elementId
        - label
        - value
        - unit

    SolveUnknownsRequest:
      type: object
      properties:
        circuit:
          $ref: "#/components/schemas/CircuitInput"
          description: |
            The circuit input. Unknown elements should already have been
            substituted with safe placeholder values so the input is valid for
            the MNA solver during verification.
        unknownElements:
          type: array
          items:
            $ref: "#/components/schemas/UnknownElementSpec"
          description: Per-unknown metadata so the AI can name each variable.
        constraints:
          type: array
          items:
            type: string
          description: |
            Free-form target constraints written by the student, e.g.
            "V(n1) = 5", "V(n1, n2) = 12V", "I(R3) = 0.2A". Each entry is one
            constraint.
        problemText:
          type: string
          description: Optional original problem statement for additional context.
      required:
        - circuit
        - unknownElements
        - constraints

    SolveUnknownsResult:
      type: object
      properties:
        unknownValues:
          type: array
          items:
            $ref: "#/components/schemas/UnknownValue"
        reasoning:
          type: string
          description: Short natural-language explanation of how the system was solved.
        verified:
          type: boolean
          description: True if substituting the AI's values made all parsed constraints hold within tolerance.
        verificationAttempts:
          type: integer
        verificationNote:
          type: string
          description: Optional message shown to the user when verification could not be completed.
        unverifiedConstraints:
          type: array
          items:
            type: string
          description: Constraints that the verifier could not parse / interpret automatically.
      required:
        - unknownValues

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content

    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        circuit:
          $ref: "#/components/schemas/CircuitInput"
        solution:
          $ref: "#/components/schemas/CircuitSolution"
        analysis:
          $ref: "#/components/schemas/AnalysisResult"
      required:
        - messages

    ChatResponse:
      type: object
      properties:
        content:
          type: string
        role:
          type: string
      required:
        - content
        - role
